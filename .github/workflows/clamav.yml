name: ClamAV - Install/Upgrade/Remove
run-name: ClamAV -  ${{ inputs.environment }} ClamAV in ${{ inputs.environment }} using ${{ github.ref_name }}
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: environment
      action:
        description: "Action"
        required: true
        type: choice
        options:
          - install
          - upgrade
          - uninstall
      clamavImageTag:
        description: "ClamAV Image Tag"
        required: true
        default: "main"

jobs:
  manageClamav:
    name: ${{ inputs.environment }} ClamAV in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      NAMESPACE: ${{ secrets.OPENSHIFT_ENV_NAMESPACE }}
    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Install CLI tools from OpenShift Mirror
        uses: redhat-actions/openshift-tools-installer@v3.1
        with:
          oc: "4"
          skip_cache: true
      - name: Log in to OpenShift
        run: |
          oc login --token=${{ secrets.SA_TOKEN }} --server=${{ vars.OPENSHIFT_CLUSTER_URL }}
      - name: Manage ClamAV
        working-directory: "./devops/helm/clam-av/main/"
        env:
          ACTION: ${{ inputs.action }}
          NAMESPACE: ${{ secrets.OPENSHIFT_ENV_NAMESPACE }}
          IMAGE_TAG: ${{ inputs.clamavImageTag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Error: IMAGE_TAG must be a valid OCI image tag."
            exit 1
          fi
          make "$ACTION" NAMESPACE="$NAMESPACE" IMAGE_TAG="$IMAGE_TAG"
